# /etc/keepalived/keepalived.conf on node2   (mode 600: auth_pass is plaintext)
# node1 MASTER 100, node2 BACKUP 90, node3 BACKUP 80.
# The VIP only needs a node with a live HAProxy: every HAProxy routes to the current
# Patroni leader by itself, so the VIP does not have to follow the Postgres leader.

global_defs {
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_haproxy {
    # pidof path differs per release: check with "command -v pidof"
    script "/usr/sbin/pidof haproxy"
    interval 2
    fall 2
    rise 2
    # > 20 (largest priority gap), so a node with dead HAProxy always drops below the next one
    weight -30
}

vrrp_instance pg_cluster {
    state BACKUP
    # NIC that gets the VIP: check with "ip a"
    interface ens160
    virtual_router_id 63
    priority 90
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass VipLab63
    }

    virtual_ipaddress {
        192.168.63.20/24
    }

    track_script {
        chk_haproxy
    }
}
