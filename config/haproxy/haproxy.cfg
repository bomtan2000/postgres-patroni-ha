# /etc/haproxy/haproxy.cfg - identical on node1, node2, node3
#
# HAProxy does not know Postgres roles. It asks Patroni's REST API (:8008) on every node:
#   GET /primary -> 200 only on the leader      -> port 5000 (read/write)
#   GET /replica -> 200 only on healthy replicas -> port 5001 (read only)
# So any of the 3 HAProxies routes to the right node, and the VIP may sit on any of them.

global
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    # on-marked-down shutdown-sessions: kill client sessions to an old leader at once,
    # so nobody keeps writing to a node that was just demoted
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 node1:5432 maxconn 100 check port 8008
    server node2 node2:5432 maxconn 100 check port 8008
    server node3 node3:5432 maxconn 100 check port 8008

listen standbys
    balance roundrobin
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 node1:5432 maxconn 100 check port 8008
    server node2 node2:5432 maxconn 100 check port 8008
    server node3 node3:5432 maxconn 100 check port 8008
