# /etc/etcd/etcd.conf.yaml on node1
# DCS for Patroni: holds the leader key and the cluster config. Quorum = 2 of 3.
name: 'node1'
initial-cluster-token: pg-cluster
# new: this node creates the cluster
initial-cluster-state: new
initial-cluster: node1=http://192.168.63.11:2380
data-dir: /var/lib/etcd

# 2380 = peer traffic (etcd <-> etcd)
initial-advertise-peer-urls: http://192.168.63.11:2380
listen-peer-urls: http://192.168.63.11:2380

# 2379 = client traffic (Patroni, etcdctl). 127.0.0.1 too, so etcdctl works locally.
advertise-client-urls: http://192.168.63.11:2379
listen-client-urls: http://192.168.63.11:2379,http://127.0.0.1:2379
